name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FashionHub2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FashionHub2.slnx

      - name: Build
        run: dotnet build FashionHub2.slnx --configuration Release --no-restore --nologo

      - name: Test
        run: dotnet test FashionHub2.slnx --configuration Release --no-build --logger "console;verbosity=minimal"
