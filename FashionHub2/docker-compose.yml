version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fashionhub-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - fashionhub-network
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P YourStrong@Passw0rd -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: FashionHub.Web/Dockerfile
    container_name: fashionhub-web
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=FashionHub;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      - GeminiAI__ApiKey=${GEMINI_API_KEY}
    ports:
      - "5167:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - fashionhub-network
    restart: unless-stopped

volumes:
  sqlserver_data:

networks:
  fashionhub-network:
    driver: bridge