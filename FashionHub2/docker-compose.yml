services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fashionhub-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - fashionhub-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -No -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fashionhub-db-init
    environment:
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      SQL_SERVER: sqlserver
    volumes:
      - ../DB_Fixed.sql:/scripts/DB_Fixed.sql:ro
      - ./init-db.sh:/scripts/init-db.sh:ro
    entrypoint: ["/bin/bash", "/scripts/init-db.sh"]
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - fashionhub-network
    restart: "no"

  web:
    build:
      context: .
      dockerfile: FashionHub.Web/Dockerfile
    container_name: fashionhub-web
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=sqlserver;Database=QL_SHOPQUANAO_PRO;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;
      GeminiAI__ApiKey: ${GEMINI_API_KEY:-}
      VnPay__PaymentUrl: ${VNPAY_PAYMENT_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VnPay__TmnCode: ${VNPAY_TMN_CODE:-}
      VnPay__HashSecret: ${VNPAY_HASH_SECRET:-}
      VnPay__ReturnUrl: ${VNPAY_RETURN_URL:-http://localhost:5167/payment/vnpay-return}
      VnPay__TransactionApiUrl: ${VNPAY_TRANSACTION_API_URL:-https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
      PasswordReset__PublicBaseUrl: ${PUBLIC_BASE_URL}
      Email__Host: ${SMTP_HOST:-}
      Email__Port: ${SMTP_PORT:-587}
      Email__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      Email__UserName: ${SMTP_USERNAME:-}
      Email__Password: ${SMTP_PASSWORD:-}
      Email__FromEmail: ${SMTP_FROM_EMAIL:-}
      Email__FromName: ${SMTP_FROM_NAME:-OWE}
    ports:
      - "5167:8080"
    volumes:
      - product_images:/app/wwwroot/images/products
      - data_protection_keys:/root/.aspnet/DataProtection-Keys
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      - fashionhub-network
    restart: unless-stopped

volumes:
  sqlserver_data:
  product_images:
  data_protection_keys:

networks:
  fashionhub-network:
    driver: bridge
